<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC Stream</title><style>:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;background:#05070a;font-family:system-ui,sans-serif;overflow:hidden}main{width:100%;height:100%;display:grid;place-items:center}video{width:100%;height:100%;object-fit:contain;background:#000;cursor:crosshair;outline:0}#status{position:fixed;left:14px;top:14px;padding:7px 10px;border-radius:9px;background:#111a;color:#fff;font:12px ui-monospace,monospace;backdrop-filter:blur(8px);z-index:2}#error{display:none;position:fixed;inset:auto 14px 14px 14px;padding:10px;border-radius:10px;background:#3a1111;color:#ffd7d7;font:13px system-ui;z-index:3;white-space:pre-wrap}#hint{position:fixed;right:14px;top:14px;padding:7px 10px;border-radius:9px;background:#111a;color:#ddd;font:12px system-ui;z-index:2}</style></head><body><main><video id="video" autoplay playsinline tabindex="0"></video></main><div id="status">connecting…</div><div id="hint">Click video for keyboard + mouse capture</div><div id="error"></div><script>
const qs=new URLSearchParams(location.search),endpoint=qs.get('endpoint');const video=document.getElementById('video'),status=document.getElementById('status'),errorBox=document.getElementById('error'),hint=document.getElementById('hint');if(!endpoint){status.textContent='missing stream endpoint';throw new Error('Missing endpoint');}let pc,dc,lastMouse=0;
const setStatus=s=>status.textContent=s;const showError=e=>{errorBox.style.display='block';errorBox.textContent=String(e?.message||e)};function send(o){if(dc&&dc.readyState==='open')dc.send(JSON.stringify(o));}function codeKey(e,down){send({type:'key',code:e.code,key:e.key,down});}function coords(e){const r=video.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};}
video.addEventListener('click',()=>{video.focus();if(document.pointerLockElement!==video)video.requestPointerLock?.()});video.addEventListener('mousemove',e=>{const now=performance.now();if(now-lastMouse<8)return;lastMouse=now;if(document.pointerLockElement===video)send({type:'mouse_rel',dx:e.movementX,dy:e.movementY});else{const p=coords(e);send({type:'mouse',x:p.x,y:p.y,buttons:e.buttons})}});video.addEventListener('mousedown',e=>{video.focus();const p=coords(e);send({type:'button',x:p.x,y:p.y,button:e.button+1,down:true})});video.addEventListener('mouseup',e=>send({type:'button',button:e.button+1,down:false}));video.addEventListener('wheel',e=>{e.preventDefault();send({type:'wheel',delta:e.deltaY})},{passive:false});window.addEventListener('keydown',e=>{if(['F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Escape','Backspace','Delete'].includes(e.code))e.preventDefault();codeKey(e,true)});window.addEventListener('keyup',e=>codeKey(e,false));video.addEventListener('dblclick',()=>{if(document.fullscreenElement)document.exitFullscreen();else video.requestFullscreen?.()});
async function start(){const password=window.prompt('WebRTC password:');if(password===null){setStatus('password required');return;}setStatus('creating WebRTC offer…');pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.ontrack=e=>{if(e.track.kind==='video'){video.srcObject=e.streams[0]||new MediaStream([e.track]);video.play().catch(()=>{hint.textContent='Click video once to enable audio'})}else if(e.track.kind==='audio'){const s=video.srcObject||new MediaStream();s.addTrack(e.track);video.srcObject=s;video.play().catch(()=>{})}};pc.onconnectionstatechange=()=>setStatus('WebRTC '+pc.connectionState);pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='failed')showError('ICE failed. Direct P2P could not connect. Configure TURN if needed.')};dc=pc.createDataChannel('input',{ordered:false,maxRetransmits:0});dc.onopen=()=>{setStatus('WebRTC connected · 1920×1080 @ 45 FPS');hint.textContent='Click video for pointer lock · double-click for fullscreen'};pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});await pc.setLocalDescription(await pc.createOffer());for(let i=0;i<120&&pc.iceGatheringState!=='complete';i++)await new Promise(r=>setTimeout(r,50));
setStatus('sending SDP offer…');const base=endpoint.replace(/^wss:\/\//,'https://').replace(/^ws:\/\//,'http://');const signalUrl=base.replace(/\/webrtc$/,'/webrtc');let response;try{response=await fetch(signalUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({password,sdp:pc.localDescription.sdp}),cache:'no-store',mode:'cors'})}catch(e){throw new Error('Signaling request failed: '+(e?.message||e)+'\nURL: '+signalUrl)}if(!response.ok)throw new Error(`Signaling HTTP ${response.status}: ${await response.text()}`);const answer=await response.json();if(!answer.sdp)throw new Error(answer.error||'Signaling returned no SDP answer');await pc.setRemoteDescription({type:'answer',sdp:answer.sdp});const r=answer.ready||{};setStatus(`WebRTC connecting · ${r.width||1920}×${r.height||1080} @ ${r.fps||45} FPS · ${r.videoCodec||'H264'}`)}start().catch(showError);
</script></body></html>
