<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terminal · Remote Desktop</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:rgba(12,16,24,.78);--line:rgba(255,255,255,.1);--text:#eef2f7;--muted:#9aa6b5;--good:#57e389;--bad:#ff6b6b;--accent:#78a9ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--text)}
#root{position:fixed;inset:0;background:#000;display:grid;place-items:center}
#surface{display:none}
#decoder{position:fixed;inset:0;width:100vw;height:100vh;display:block;object-fit:contain;outline:0;touch-action:none;cursor:none;background:#000;z-index:1}
#remote-cursor{position:fixed;left:0;top:0;width:28px;height:32px;z-index:25;pointer-events:none;transform:translate(0,0);filter:drop-shadow(0 2px 3px #000b);display:none;will-change:left,top}
#remote-cursor svg{width:28px;height:32px;display:block}
#remote-cursor.clicking{transform:scale(.9);transform-origin:1px 1px}
#hud{position:fixed;left:14px;right:14px;top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;z-index:10;transition:opacity .25s}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px #0008;backdrop-filter:blur(16px);border-radius:12px;padding:8px 11px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
#state{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#888;box-shadow:0 0 12px currentColor}.ok{color:var(--good)}.bad{color:var(--bad)}
#toolbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 50px #0009;backdrop-filter:blur(18px);z-index:20;opacity:0;transition:opacity .2s}
body:hover #toolbar,body:focus-within #toolbar{opacity:1}button{border:1px solid var(--line);background:#ffffff0a;color:var(--text);padding:8px 11px;border-radius:9px;cursor:pointer}button:hover{background:#ffffff18}button.active{background:#78a9ff2b;border-color:#78a9ff66}
#error{display:none;position:fixed;left:14px;right:14px;bottom:80px;padding:12px 14px;border-radius:12px;background:#321215e8;border:1px solid #ff6b6b55;color:#ffd7d7;white-space:pre-wrap;font:13px ui-monospace,monospace;z-index:30}
#hint{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:#111a;color:#cbd5e1;font-size:12px;z-index:15;pointer-events:none;transition:opacity .3s}.hide{opacity:0}
</style>
</head>
<body>
<div id="root"><canvas id="surface" tabindex="0"></canvas></div>
<video id="decoder" autoplay playsinline muted tabindex="0"></video>
<audio id="remote-audio" autoplay playsinline></audio>
<div id="remote-cursor" aria-hidden="true"><svg viewBox="0 0 28 32" xmlns="http://www.w3.org/2000/svg"><path d="M2 1 L2 27 L9 20 L14 30 L18 28 L13 18 L24 18 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg></div>
<div id="hud"><div class="panel" id="state"><span class="dot"></span><span>Connecting…</span></div><div class="panel" id="stats">—</div></div>
<div id="hint">Click the desktop to control it · Esc releases pointer lock</div>
<div id="toolbar"><button id="pointer">🖱 Pointer</button><button id="fullscreen">⛶ Fullscreen</button><button id="mute">🔊 Audio</button><button id="fit">Fit</button><button id="reload">↻ Reconnect</button></div>
<div id="error"></div>
<script>
const qs=new URLSearchParams(location.search),endpoint=qs.get('endpoint');
const canvas=document.getElementById('surface'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const decoder=document.getElementById('decoder'),remoteAudio=document.getElementById('remote-audio'),state=document.getElementById('state'),stats=document.getElementById('stats'),errorBox=document.getElementById('error'),hint=document.getElementById('hint');
const pointerBtn=document.getElementById('pointer'),fullscreenBtn=document.getElementById('fullscreen'),muteBtn=document.getElementById('mute'),fitBtn=document.getElementById('fit'),reloadBtn=document.getElementById('reload'),remoteCursor=document.getElementById('remote-cursor');
let pc=null,dc=null,pointerDc=null,drawRunning=false,lastFrame=0,lastStats=performance.now(),lastDecoded=null,remoteW=1920,remoteH=1080,fitMode='contain',audioEnabled=true,lastPointer={x:.5,y:.5},pendingMove=null,moveFrame=0,pendingAbsolute=null,absoluteFrame=0,pressedButtons=new Set();
const pointerTypes=new Set(['mouse','mouse_rel','button','wheel']);
if(!endpoint){state.querySelector('span:last-child').textContent='Missing endpoint';throw new Error('Missing endpoint');}
const setState=(text,kind='')=>{state.innerHTML=`<span class="dot ${kind}"></span><span>${text}</span>`};
const showError=e=>{errorBox.style.display='block';errorBox.textContent=String(e?.message||e);setState('Error','bad')};
const send=o=>{const ch=pointerTypes.has(o.type)?pointerDc:dc;if(ch&&ch.readyState==='open'){if(ch===pointerDc&&ch.bufferedAmount>8192)return false;ch.send(JSON.stringify(o));return true;}return false;};
function resize(){decoder.style.width='100vw';decoder.style.height='100vh';decoder.style.objectFit=fitMode==='cover'?'cover':'contain';renderCursor();}
function contentRect(){const r=decoder.getBoundingClientRect(),vw=remoteW||decoder.videoWidth||1920,vh=remoteH||decoder.videoHeight||1080;const scale=fitMode==='cover'?Math.max(r.width/vw,r.height/vh):Math.min(r.width/vw,r.height/vh);return{left:r.left+(r.width-vw*scale)/2,top:r.top+(r.height-vh*scale)/2,width:vw*scale,height:vh*scale,scale};}
function draw(){decoder.style.objectFit=fitMode==='cover'?'cover':'contain';}

function coords(e){const q=contentRect();let x=(e.clientX-q.left)/q.width,y=(e.clientY-q.top)/q.height;return{x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y))};}
function renderCursor(){const q=contentRect();remoteCursor.style.left=(q.left+lastPointer.x*q.width)+'px';remoteCursor.style.top=(q.top+lastPointer.y*q.height)+'px';remoteCursor.style.display='block';}
function sendAbsolute(p){pendingAbsolute={x:Math.max(0,Math.min(1,p.x)),y:Math.max(0,Math.min(1,p.y))};if(!absoluteFrame)absoluteFrame=requestAnimationFrame(flushAbsolute);}function flushAbsolute(){absoluteFrame=0;if(!pendingAbsolute)return;const p=pendingAbsolute;pendingAbsolute=null;lastPointer=p;renderCursor();send({type:'mouse',x:p.x,y:p.y});}
function sendButton(button,down){if(down)pressedButtons.add(button);else pressedButtons.delete(button);send({type:'button',button,down});}
function flushMove(){moveTimer=null;if(!pendingMove)return;const m=pendingMove;pendingMove=null;lastPointer.x=Math.max(0,Math.min(1,lastPointer.x+m.dx/Math.max(1,remoteW)));lastPointer.y=Math.max(0,Math.min(1,lastPointer.y+m.dy/Math.max(1,remoteH)));renderCursor();if(!send({type:'mouse_rel',dx:m.dx,dy:m.dy})){pendingMove=m;moveTimer=setTimeout(flushMove,4);}}
function queueMove(dx,dy){if(!pendingMove)pendingMove={dx:0,dy:0};pendingMove.dx+=dx;pendingMove.dy+=dy;if(moveTimer===null)moveTimer=setTimeout(flushMove,4);}
decoder.addEventListener('click',async()=>{decoder.focus();hint.classList.add('hide');if(document.pointerLockElement!==decoder){try{await decoder.requestPointerLock()}catch{}}});
decoder.addEventListener('mousemove',e=>{if(document.pointerLockElement===decoder)queueMove(e.movementX,e.movementY);else{const p=coords(e);sendAbsolute(p);}});
decoder.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();decoder.focus();remoteCursor.classList.add('clicking');sendButton(e.button+1,true);});
decoder.addEventListener('auxclick',e=>{e.preventDefault();e.stopPropagation();});
decoder.addEventListener('mouseup',e=>{e.preventDefault();e.stopPropagation();remoteCursor.classList.remove('clicking');sendButton(e.button+1,false);});
decoder.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();});
decoder.addEventListener('dragstart',e=>{e.preventDefault();e.stopPropagation();});
decoder.addEventListener('selectstart',e=>{e.preventDefault();e.stopPropagation();});
decoder.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();});
document.addEventListener('click',e=>{if(e.target===decoder){e.preventDefault();e.stopPropagation();}},true);
decoder.addEventListener('wheel',e=>{e.preventDefault();send({type:'wheel',delta:e.deltaY});},{passive:false});
async function handleClipboardPaste(e){
  e.preventDefault();
  e.stopPropagation();
  try{
    const text=await navigator.clipboard.readText();
    if(dc?.readyState==='open')dc.send(JSON.stringify({type:'paste',text}));
  }catch(err){
    hint.textContent='Clipboard permission denied — allow clipboard access for this site';
    hint.classList.remove('hide');
    setTimeout(()=>hint.classList.add('hide'),3500);
  }
}
let composing=false;
window.addEventListener('compositionstart',()=>{composing=true;});
window.addEventListener('compositionend',e=>{
  composing=false;
  if(e.data && dc?.readyState==='open')dc.send(JSON.stringify({type:'text',text:e.data}));
});
window.addEventListener('keydown',e=>{
  const ctrl=e.ctrlKey||e.metaKey;
  if(ctrl && e.code==='KeyV'){
    handleClipboardPaste(e);
    return;
  }
  if(ctrl && e.code==='KeyC'){
    e.preventDefault();
    e.stopPropagation();
    send({type:'key',code:e.code,key:e.key,down:true});
    setTimeout(()=>send({type:'key',code:e.code,key:e.key,down:false}),0);
    // Give the X11 application time to update its CLIPBOARD selection, then
    // return the remote clipboard to the browser.
    clearTimeout(window._clipboardCopyTimer);window._clipboardCopyTimer=setTimeout(()=>send({type:'clipboard-copy'}),120);
    return;
  }
  if(composing || e.isComposing)return;
  // Non-ASCII committed characters (Persian/Arabic/CJK/emoji/etc.) must not
  // depend on the remote XKB layout. Send the actual Unicode text instead.
  if(!ctrl && !e.altKey && e.key && e.key.length===1 && e.key.charCodeAt(0)>127){
    e.preventDefault();
    if(dc?.readyState==='open')dc.send(JSON.stringify({type:'text',text:e.key}));
    return;
  }
  if(['F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Escape','Backspace','Delete'].includes(e.code))e.preventDefault();
  send({type:'key',code:e.code,key:e.key,down:true});
});
window.addEventListener('keyup',e=>{
  if(composing || e.isComposing)return;
  send({type:'key',code:e.code,key:e.key,down:false});
});
window.addEventListener('resize',()=>{resize();renderCursor();});
fullscreenBtn.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
pointerBtn.onclick=()=>{decoder.focus();decoder.requestPointerLock?.();};
fitBtn.onclick=()=>{fitMode=fitMode==='contain'?'cover':'contain';fitBtn.textContent=fitMode==='contain'?'Fit':'Fill';decoder.style.objectFit=fitMode==='cover'?'cover':'contain';renderCursor();};
muteBtn.onclick=()=>{audioEnabled=!audioEnabled;remoteAudio.muted=!audioEnabled;muteBtn.textContent=audioEnabled?'🔊 Audio':'🔇 Muted';if(audioEnabled)remoteAudio.play().catch(()=>{hint.textContent='Click Audio once to enable sound';hint.classList.remove('hide');});};
reloadBtn.onclick=()=>location.reload();
document.addEventListener('pointerlockchange',()=>{const locked=document.pointerLockElement===decoder;pointerBtn.classList.toggle('active',locked);remoteCursor.style.display='block';if(locked)renderCursor();});
window.addEventListener('blur',()=>{for(const b of pressedButtons)sendButton(b,false);pressedButtons.clear();});
setInterval(async()=>{if(!pc)return;try{const rs=await pc.getStats();let inbound=null;rs.forEach(r=>{if(r.type==='inbound-rtp'&&r.kind==='video')inbound=r});if(inbound){const now=performance.now(),dt=(now-lastStats)/1000;const q=decoder.getVideoPlaybackQuality?.();const decoded=q?.totalVideoFrames??inbound.framesDecoded??0;let fps=0;if(lastDecoded!==null&&dt>0)fps=Math.max(0,(decoded-lastDecoded)/dt);lastDecoded=decoded;lastStats=now;stats.textContent=`${remoteW}×${remoteH} · ${fps.toFixed(0)} fps · ${Math.round((inbound.bytesReceived||0)/1024)} KB · loss ${inbound.packetsLost??0}`;}}catch(e){}} ,1000);
async function start(){errorBox.style.display='none';const password=window.prompt('WebRTC password:');if(password===null){setState('Password required','bad');return;}setState('Creating connection…');
pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
pc.onconnectionstatechange=()=>{const s=pc.connectionState;setState('WebRTC '+s,s==='connected'?'ok':(s==='failed'?'bad':''));};
pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='failed')showError('ICE failed. Direct P2P could not connect. Configure TURN.');};
pc.ontrack=e=>{if(e.track.kind==='video'){decoder.srcObject=decoder.srcObject||new MediaStream();decoder.srcObject.addTrack(e.track);decoder.play().catch(()=>{});drawRunning=true;setState('Video connected','ok');decoder.style.objectFit=fitMode==='cover'?'cover':'contain';requestAnimationFrame(renderCursor);setTimeout(renderCursor,100);setTimeout(renderCursor,500);}else if(e.track.kind==='audio'){remoteAudio.srcObject=new MediaStream([e.track]);remoteAudio.muted=!audioEnabled;remoteAudio.play().catch(()=>{hint.textContent='Click Audio once to enable sound';hint.classList.remove('hide');});}};
dc=pc.createDataChannel('control',{ordered:true});pointerDc=pc.createDataChannel('pointer',{ordered:false,maxRetransmits:0});pointerDc.bufferedAmountLowThreshold=2048;
dc.onopen=()=>{setState('Remote desktop connected','ok');hint.textContent='Click desktop for real keyboard + mouse control · Ctrl+V/C copy & paste · Esc releases pointer lock';setTimeout(()=>hint.classList.add('hide'),4500);};
dc.onmessage=e=>{
  try{
    const msg=JSON.parse(e.data);
    if(msg.type==='clipboard' && typeof msg.text==='string'){
      navigator.clipboard?.writeText(msg.text).then(()=>{
        hint.textContent='Copied from remote desktop';
        hint.classList.remove('hide');
        setTimeout(()=>hint.classList.add('hide'),1800);
      }).catch(()=>{
        hint.textContent='Remote text copied — browser blocked automatic clipboard write';
        hint.classList.remove('hide');
        setTimeout(()=>hint.classList.add('hide'),3500);
      });
    }
  }catch{}
};
pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});await pc.setLocalDescription(await pc.createOffer());for(let i=0;i<120&&pc.iceGatheringState!=='complete';i++)await new Promise(r=>setTimeout(r,50));
const base=endpoint.replace(/^wss:\/\//,'https://').replace(/^ws:\/\//,'http://');const signalUrl=base.replace(/\/webrtc$/,'/webrtc');let response;try{response=await fetch(signalUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({password,sdp:pc.localDescription.sdp}),cache:'no-store',mode:'cors'});}catch(e){throw new Error('Signaling request failed: '+(e?.message||e)+'\nURL: '+signalUrl)}if(!response.ok)throw new Error(`Signaling HTTP ${response.status}: ${await response.text()}`);const answer=await response.json();if(!answer.sdp)throw new Error(answer.error||'Signaling returned no SDP answer');await pc.setRemoteDescription({type:'answer',sdp:answer.sdp});const r=answer.ready||{};remoteW=r.width||1920;remoteH=r.height||1080;stats.textContent=`${remoteW}×${remoteH} · ${r.videoCodecs?.join('/')||'auto'}`;resize();renderCursor();}
start().catch(showError);
</script>
</body>
</html>
