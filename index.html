<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0f" />
    <title>GitHub Terminal</title>
    <style>
      html,body,#root{margin:0;width:100%;height:100%;font-family:Inter,Roboto,Arial,sans-serif;background:#090b0f;color:#fff}
      *{box-sizing:border-box}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState } from 'https://esm.sh/react@19.1.1';
      import { createRoot } from 'https://esm.sh/react-dom@19.1.1/client';
      import {
        AppBar, Box, Button, Chip, CssBaseline, Divider, IconButton, List, ListItemButton,
        ListItemText, Paper, Stack, Tab, Tabs, TextField, ThemeProvider, Toolbar,
        Tooltip, Typography, createTheme
      } from 'https://esm.sh/@mui/material@7.3.1?deps=react@19.1.1,react-dom@19.1.1';

      const e = React.createElement;
      const themeDark = createTheme({
        palette:{mode:'dark',primary:{main:'#7c4dff'},secondary:{main:'#00bcd4'},background:{default:'#090b0f',paper:'#11151c'}},
        shape:{borderRadius:12},
        typography:{fontFamily:'Inter,Roboto,Arial,sans-serif'}
      });

      const commands = {
        help:'Available commands: help, ls, pwd, whoami, git status, clear',
        ls:'Applications  Documents  Downloads  Projects  src  README.md',
        pwd:'/home/user',
        whoami:'user',
        'git status':'On branch main\nYour branch is up to date with origin/main.\n\nnothing to commit, working tree clean'
      };

      function App(){
        const [dark,setDark]=useState(true);
        const [tabs,setTabs]=useState([{id:1,name:'bash'}]);
        const [active,setActive]=useState(1);
        const [input,setInput]=useState('');
        const [lines,setLines]=useState(['GitHub Terminal UI','Type "help" to see available commands.','']);
        const [history,setHistory]=useState([]);

        const run=()=>{
          const cmd=input.trim();
          if(!cmd)return;
          const out = cmd==='clear' ? null : (commands[cmd] ?? `command not found: ${cmd}`);
          setHistory(h=>[...h,cmd]);
          setLines(prev=>cmd==='clear' ? [] : [...prev, `$ ${cmd}`, ...(out?out.split('\n'):[]), '']);
          setInput('');
        };
        const addTab=()=>{const id=Date.now();setTabs(t=>[...t,{id,name:'bash'}]);setActive(id)};
        const closeTab=(id)=>{if(tabs.length===1)return;const rest=tabs.filter(t=>t.id!==id);setTabs(rest);if(active===id)setActive(rest[0].id)};

        return e(ThemeProvider,{theme:dark?themeDark:createTheme({palette:{mode:'light',primary:{main:'#6750a4'},background:{default:'#f5f5f7',paper:'#fff'}}})},
          e(CssBaseline),
          e(Box,{sx:{height:'100%',display:'flex',flexDirection:'column',bgcolor:'background.default'}},
            e(AppBar,{position:'static',elevation:0,sx:{borderBottom:'1px solid',borderColor:'divider',bgcolor:'background.paper'}},
              e(Toolbar,{sx:{minHeight:'64px!important',gap:1.5}},
                e(Typography,{variant:'h6',sx:{fontWeight:800,letterSpacing:-.5}},'◉ terminal'),
                e(Chip,{label:'Material UI',size:'small',color:'primary',variant:'outlined',sx:{ml:1}}),
                e(Box,{sx:{flex:1}}),
                e(Button,{size:'small',onClick:()=>setDark(v=>!v)},dark?'Light':'Dark'),
                e(Button,{size:'small',variant:'contained',onClick:addTab},'+ New terminal')
              )
            ),
            e(Box,{sx:{display:'flex',flex:1,minHeight:0}},
              e(Box,{sx:{width:240,borderRight:'1px solid',borderColor:'divider',p:1.5,display:{xs:'none',md:'block'}}},
                e(Typography,{variant:'overline',sx:{px:1,color:'text.secondary'}},'Workspace'),
                e(List,{dense:true},['Dashboard','Terminals','History','Files','Repositories','Settings'].map((x,i)=>e(ListItemButton,{key:x,selected:i===1,borderRadius:2},e(ListItemText,{primary:x}))))
              ),
              e(Box,{sx:{flex:1,minWidth:0,display:'flex',flexDirection:'column'}},
                e(Tabs,{value:active,onChange:(_,v)=>setActive(v),variant:'scrollable',scrollButtons:'auto',sx:{minHeight:48,borderBottom:'1px solid',borderColor:'divider'}},
                  tabs.map(t=>e(Tab,{key:t.id,value:t.id,label:e(Box,{sx:{display:'flex',alignItems:'center',gap:.8}},t.name,e('span',{onClick:(ev)=>{ev.stopPropagation();closeTab(t.id)},style:{opacity:.7,cursor:'pointer'}},'×'))}))
                ),
                e(Box,{sx:{p:1.5,borderBottom:'1px solid',borderColor:'divider'}},
                  e(Stack,{direction:'row',alignItems:'center',spacing:1},
                    e(Chip,{label:'/home/user',size:'small',variant:'outlined'}),e(Box,{sx:{flex:1}}),
                    e(Button,{size:'small',onClick:()=>navigator.clipboard?.writeText(lines.join('\n'))},'Copy'),
                    e(Button,{size:'small',onClick:()=>setLines([])},'Clear')
                  )
                ),
                e(Paper,{square:true,elevation:0,sx:{m:1.5,mb:0,flex:1,minHeight:0,overflow:'auto',p:2.5,bgcolor:'#05070a',color:'#d6e4d8',fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',fontSize:14,lineHeight:1.7}},
                  lines.map((line,i)=>e('div',{key:i,style:{whiteSpace:'pre-wrap'}},line))
                ),
                e(Box,{sx:{p:1.5}},
                  e(Stack,{direction:'row',spacing:1,alignItems:'center'},
                    e(Typography,{sx:{fontFamily:'monospace',color:'primary.main',fontWeight:700}},'$'),
                    e(TextField,{fullWidth:true,size:'small',value:input,onChange:ev=>setInput(ev.target.value),onKeyDown:ev=>{if(ev.key==='Enter')run();if(ev.key==='ArrowUp'&&history.length)setInput(history[history.length-1])},placeholder:'Type a command…',autoFocus:true}),
                    e(Button,{variant:'contained',onClick:run},'Run')
                  )
                ),
                e(Box,{sx:{px:2,py:.75,borderTop:'1px solid',borderColor:'divider',display:'flex',gap:2,color:'text.secondary',fontSize:12}},
                  e('span',null,'bash'),e('span',null,'UTF-8'),e('span',null,'LF'),e('span',null,'UI mode'),e(Box,{sx:{flex:1}}),e('span',null,'GitHub Pages')
                )
              )
            )
          )
        );
      }
      createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>
