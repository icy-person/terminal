name: GitHub Hosted WebRTC Game Stream (Fixed Password)

on:
  workflow_dispatch:
    inputs:
      fps:
        description: Target capture FPS (30-45)
        required: true
        default: '45'
        type: choice
        options: ['30', '40', '45']
      bitrate:
        description: H.264 target bitrate in bits/s
        required: true
        default: '10000000'
        type: string
      idle_seconds:
        description: Health-check interval
        required: true
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-webrtc-stream
  cancel-in-progress: true

jobs:
  stream:
    name: Browser WebRTC stream (Arch + XFCE)
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm python python-pip python-virtualenv git curl ca-certificates sudo pkgconf ffmpeg xorg-server-xvfb xorg-xauth xorg-xhost xorg-xdpyinfo xfce4 xfce4-terminal dbus pipewire pipewire-pulse pipewire-alsa wireplumber alsa-utils mesa mesa-utils vulkan-icd-loader vulkan-tools vulkan-swrast libx11 libxtst
          python -m venv /opt/webrtc-venv
          /opt/webrtc-venv/bin/pip install --upgrade pip wheel
          /opt/webrtc-venv/bin/pip install --only-binary=:all: -r runner/requirements-webrtc.txt
          /opt/webrtc-venv/bin/python -c 'import av,aiortc; print("PyAV",av.__version__,"aiortc",aiortc.__version__)'

      - name: Start X11 + XFCE + PipeWire
        shell: bash
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash streamuser
          usermod -aG audio streamuser || true
          STREAM_UID="$(id -u streamuser)"
          XDG_RUNTIME_DIR="/run/user/$STREAM_UID"
          echo "STREAM_UID=$STREAM_UID" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          export DISPLAY=:99 XAUTHORITY=/tmp/webrtc.Xauthority
          touch "$XAUTHORITY"; chmod 600 "$XAUTHORITY"
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -ac +extension GLX +extension RANDR +extension MIT-SHM > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 30); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          xhost +local: >/dev/null
          install -d -m 700 -o streamuser -g streamuser "$XDG_RUNTIME_DIR"
          runuser -u streamuser -- env DISPLAY="$DISPLAY" XAUTHORITY="$XAUTHORITY" XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" bash -lc 'pipewire >/tmp/pipewire.log 2>&1 & pipewire-pulse >/tmp/pipewire-pulse.log 2>&1 & wireplumber >/tmp/wireplumber.log 2>&1 & sleep 2; dbus-run-session -- startxfce4 >/tmp/xfce.log 2>&1 &'
          for _ in $(seq 1 60); do pgrep -u streamuser -x xfce4-session >/dev/null 2>&1 && pgrep -u streamuser -x xfwm4 >/dev/null 2>&1 && break; sleep 1; done
          pgrep -u streamuser -x xfce4-session >/dev/null
          pgrep -u streamuser -x xfwm4 >/dev/null

      - name: Start authenticated WebRTC server
        shell: bash
        env:
          WEBRTC_PASSWORD: ${{ secrets.WEBRTC_PASSWORD }}
          WEBRTC_FPS: ${{ inputs.fps || '45' }}
          WEBRTC_VIDEO_BITRATE: ${{ inputs.bitrate || '10000000' }}
          WEBRTC_TURN_URL: ${{ secrets.WEBRTC_TURN_URL }}
          WEBRTC_TURN_USERNAME: ${{ secrets.WEBRTC_TURN_USERNAME }}
          WEBRTC_TURN_PASSWORD: ${{ secrets.WEBRTC_TURN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WEBRTC_PASSWORD" || { echo 'Missing repository secret: WEBRTC_PASSWORD'; exit 1; }
          export DISPLAY=:99 XAUTHORITY=/tmp/webrtc.Xauthority
          export XDG_RUNTIME_DIR="/run/user/$STREAM_UID"
          export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse/native"
          nohup /opt/webrtc-venv/bin/python runner/webrtc_server.py > "$RUNNER_TEMP/webrtc.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8092/healthz >/dev/null 2>&1 && break; sleep 1; done
          if ! curl -fsS http://127.0.0.1:8092/healthz; then cat "$RUNNER_TEMP/webrtc.log"; exit 1; fi

      - name: Start Cloudflare signaling tunnel
        shell: bash
        env:
          WEBRTC_TURN_URL: ${{ secrets.WEBRTC_TURN_URL }}
          WEBRTC_TURN_USERNAME: ${{ secrets.WEBRTC_TURN_USERNAME }}
          WEBRTC_TURN_PASSWORD: ${{ secrets.WEBRTC_TURN_PASSWORD }}
        run: |
          set -euo pipefail
          V='2026.9.1'
          CLOUDFLARED="$RUNNER_TEMP/cloudflared"
          CLOUDFLARED_LOG="$RUNNER_TEMP/cloudflared.log"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/$V/cloudflared-linux-amd64" -o "$CLOUDFLARED"
          chmod +x "$CLOUDFLARED"
          rm -f "$CLOUDFLARED_LOG"
          nohup "$CLOUDFLARED" tunnel --no-autoupdate --url http://127.0.0.1:8092 > "$CLOUDFLARED_LOG" 2>&1 &
          CLOUDFLARED_PID=$!
          echo "[Cloudflare] cloudflared PID: $CLOUDFLARED_PID"

          URL=''
          for _ in $(seq 1 90); do
            URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' "$CLOUDFLARED_LOG" | head -n1 || true)"
            [ -n "$URL" ] && break
            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo '[Cloudflare] cloudflared exited before publishing a URL'
              cat "$CLOUDFLARED_LOG"
              exit 1
            fi
            sleep 2
          done
          [ -n "$URL" ] || { echo '[Cloudflare] Timed out waiting for Quick Tunnel URL'; cat "$CLOUDFLARED_LOG"; exit 1; }

          HOST="${URL#https://}"
          echo "[Cloudflare] Quick Tunnel URL: $URL"
          echo "[Cloudflare] Host: $HOST"

          echo '=== Tunnel readiness / DNS diagnostics ==='
          curl -fsS --max-time 5 http://127.0.0.1:8092/healthz; echo

          READY=0
          LAST_ERROR=''
          for attempt in $(seq 1 30); do
            echo "[Cloudflare] readiness attempt $attempt/30"
            LOCAL_IPS="$(getent ahostsv4 "$HOST" 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, - || true)"
            echo "[DNS] runner resolver A: ${LOCAL_IPS:-not resolved yet}"

            CF_DOH="$(curl -fsS --max-time 5 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$HOST&type=A" 2>/dev/null || true)"
            GOOGLE_DOH="$(curl -fsS --max-time 5 "https://dns.google/resolve?name=$HOST&type=A" 2>/dev/null || true)"
            CF_IPS="$(python3 - "$CF_DOH" <<'PY'
            import json,sys
            try:
              d=json.loads(sys.argv[1])
              print(','.join(sorted({a['data'] for a in d.get('Answer',[]) if a.get('type')==1 and a.get('data')})))
            except Exception:
                      pass
                        PY
              )"
            GOOGLE_IPS="$(python3 - "$GOOGLE_DOH" <<'PY'
            import json,sys
            try:
            d=json.loads(sys.argv[1])
            print(','.join(sorted({a['data'] for a in d.get('Answer',[]) if a.get('type')==1 and a.get('data')})))
            except Exception:
            pass
            PY
            )"
            echo "[DNS] Cloudflare DoH A: ${CF_IPS:-not resolved}"
            echo "[DNS] Google DoH A: ${GOOGLE_IPS:-not resolved}"

            if curl -fsS --max-time 10 "$URL/healthz" >/tmp/public-health.json 2>/tmp/public-health.err; then
              echo '[HTTP] normal DNS + HTTPS: READY'
              cat /tmp/public-health.json; echo
              READY=1
              break
            fi
            LAST_ERROR="$(cat /tmp/public-health.err 2>/dev/null || true)"
            echo "[HTTP] normal DNS + HTTPS: not ready (${LAST_ERROR:-unknown error})"

            TEST_IP=''
            if [ -n "$LOCAL_IPS" ]; then TEST_IP="${LOCAL_IPS%%,*}"; elif [ -n "$CF_IPS" ]; then TEST_IP="${CF_IPS%%,*}"; elif [ -n "$GOOGLE_IPS" ]; then TEST_IP="${GOOGLE_IPS%%,*}"; fi
            if [ -n "$TEST_IP" ]; then
              echo "[HTTP] forced HTTPS test via $TEST_IP"
              if curl -fsS --max-time 10 --resolve "$HOST:443:$TEST_IP" "$URL/healthz" >/tmp/public-health-forced.json 2>/tmp/public-health-forced.err; then
                echo '[HTTP] forced DNS + HTTPS: READY'
                cat /tmp/public-health-forced.json; echo
                READY=1
                break
              fi
              echo "[HTTP] forced HTTPS: $(cat /tmp/public-health-forced.err 2>/dev/null || true)"
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo '[Cloudflare] cloudflared exited while waiting for readiness'
              break
            fi
            sleep 3
          done

          if [ "$READY" -ne 1 ]; then
            echo '=== Cloudflare readiness FAILED ==='
            echo "[Cloudflare] URL: $URL"
            echo "[Cloudflare] PID alive: $(kill -0 "$CLOUDFLARED_PID" 2>/dev/null && echo yes || echo no)"
            echo "[Cloudflare] Last HTTP error: ${LAST_ERROR:-none}"
            echo '--- cloudflared log ---'
            cat "$CLOUDFLARED_LOG" || true
            echo '--- local WebRTC health ---'
            curl -v --max-time 5 http://127.0.0.1:8092/healthz || true
            echo '--- WebRTC server log ---'
            tail -n 120 "$RUNNER_TEMP/webrtc.log" || true
            echo '--- runner DNS configuration ---'
            cat /etc/resolv.conf || true
            echo '--- runner resolver ---'
            getent ahostsv4 "$HOST" || true
            echo '--- Cloudflare DoH raw response ---'
            printf '%s\n' "$CF_DOH" || true
            echo '--- Google DoH raw response ---'
            printf '%s\n' "$GOOGLE_DOH" || true
            exit 1
          fi

          echo '=== Public signaling auth check ==='
          STATUS="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/auth-check.json" -w '%{http_code}' -X POST -H 'Content-Type: text/plain' --data '{"password":"","sdp":""}' "$URL/webrtc")"
          cat "$RUNNER_TEMP/auth-check.json"; echo
          test "$STATUS" = 401 || { echo "Unexpected auth status: $STATUS"; exit 1; }
          STREAM_WS="${URL/https:\/\//wss://}/webrtc"
          STREAM_PAGE="https://icy-person.github.io/terminal/stream.html?endpoint=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$STREAM_WS")"
          echo "[WebRTC] Stream page: $STREAM_PAGE"
          echo "[WebRTC] Signaling: $STREAM_WS"
          echo '[WebRTC] Authentication: fixed WEBRTC_PASSWORD; password is entered in the browser and never put in the URL'
          echo "[WebRTC] Target: ${{ inputs.fps || '45' }} FPS / ${{ inputs.bitrate || '10000000' }} bps"
          if [ -n "${WEBRTC_TURN_URL:-}" ] && [ -n "${WEBRTC_TURN_USERNAME:-}" ] && [ -n "${WEBRTC_TURN_PASSWORD:-}" ]; then echo '[WebRTC] TURN relay: configured'; else echo '[WebRTC] TURN relay: not configured'; fi

      - name: Keep WebRTC runner alive
        shell: bash
        env:
          IDLE_SECONDS: ${{ inputs.idle_seconds || '5' }}
        run: |
          set -euo pipefail
          while true; do
            echo "[$(date -Is)] WebRTC=$(curl -fsS http://127.0.0.1:8092/healthz || true)"
            tail -n 8 "$RUNNER_TEMP/webrtc.log" 2>/dev/null || true
            sleep "${IDLE_SECONDS:-5}"
          done
