name: GitHub Hosted Terminal Runner

on:
  workflow_dispatch:
    inputs:
      shell:
        description: "Shell to run inside the hosted runner"
        required: true
        default: "bash"
        type: choice
        options:
          - bash
          - sh
      idle_seconds:
        description: "Health-check interval"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

# GitHub-hosted runners are ephemeral. This workflow keeps one job alive
# for the duration of the workflow and exposes the PTY only through an
# outbound Cloudflare Quick Tunnel connection.
concurrency:
  group: hosted-terminal
  cancel-in-progress: true

jobs:
  terminal:
    name: Hosted terminal (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: $(uname -srm)"
          echo "Host: $(hostname)"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          echo "Shell: ${{ inputs.shell || 'bash' }}"

      - name: Install ttyd
        shell: bash
        run: |
          set -euo pipefail

          TTYD_VERSION="1.7.7"
          curl -fsSL \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64" \
            -o "$RUNNER_TEMP/ttyd"
          chmod +x "$RUNNER_TEMP/ttyd"
          "$RUNNER_TEMP/ttyd" --version

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARED_VERSION="2026.9.1"
          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

      - name: Start hosted PTY terminal
        id: start-terminal
        shell: bash
        env:
          TERMINAL_SHELL: ${{ inputs.shell || 'bash' }}
        run: |
          set -euo pipefail

          TOKEN="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24))
          PY
          )"

          printf '%s' "$TOKEN" > "$RUNNER_TEMP/terminal-token"
          chmod 600 "$RUNNER_TEMP/terminal-token"

          if [ "$TERMINAL_SHELL" = "sh" ]; then
            SHELL_CMD="/bin/sh"
            SHELL_ARGS=""
          else
            SHELL_CMD="/bin/bash"
            SHELL_ARGS="--login"
          fi

          nohup "$RUNNER_TEMP/ttyd" \
            -W \
            -p 7681 \
            -i 127.0.0.1 \
            -P 5 \
            -c "terminal:${TOKEN}" \
            "$SHELL_CMD" $SHELL_ARGS \
            > "$RUNNER_TEMP/ttyd.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/ttyd.pid"
          sleep 2

          if ! kill -0 "$(cat "$RUNNER_TEMP/ttyd.pid")" 2>/dev/null; then
            echo "ttyd failed to start"
            cat "$RUNNER_TEMP/ttyd.log"
            exit 1
          fi

          echo "PTY terminal started on 127.0.0.1:7681"
          echo "Authentication: basic auth enabled"

      - name: Start public tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail

          nohup "$RUNNER_TEMP/cloudflared" tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:7681 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/cloudflared.pid"

          URL=""
          for _ in $(seq 1 30); do
            URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n1 || true)"
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Cloudflare tunnel did not provide a public URL"
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          echo "TERMINAL_URL=$URL" >> "$GITHUB_ENV"
          echo "Terminal URL: $URL"
          echo "Terminal username: terminal"
          echo "Terminal password is generated for this run and is intentionally not printed."
          echo "Open the URL and provide the generated credentials to the terminal client."

      - name: Write connection metadata
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "GitHub hosted terminal"
            echo "Runner: ${RUNNER_NAME}"
            echo "URL: ${TERMINAL_URL:-unknown}"
            echo "Username: terminal"
            echo "Password: generated per run; stored only on the runner"
            echo "Expires: when the workflow/job ends"
          } > "$RUNNER_TEMP/terminal-connection.txt"

          echo ""
          cat "$RUNNER_TEMP/terminal-connection.txt"
          echo ""
          echo "For security, the password is not emitted to Actions logs."

      - name: Keep runner alive and monitor services
        shell: bash
        env:
          IDLE_SECONDS: ${{ inputs.idle_seconds || '3' }}
        run: |
          set -euo pipefail

          echo "Hosted terminal is ready."
          echo "The job will remain alive until cancelled or timeout (350 minutes)."

          while true; do
            TTYD_PID="$(cat "$RUNNER_TEMP/ttyd.pid")"
            TUNNEL_PID="$(cat "$RUNNER_TEMP/cloudflared.pid")"

            if ! kill -0 "$TTYD_PID" 2>/dev/null; then
              echo "[$(date -Is)] ERROR: ttyd stopped"
              tail -n 50 "$RUNNER_TEMP/ttyd.log" || true
              exit 1
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "[$(date -Is)] ERROR: cloudflared stopped"
              tail -n 50 "$RUNNER_TEMP/cloudflared.log" || true
              exit 1
            fi

            printf '[%s] runner=%s ttyd=alive tunnel=alive url=%s\n' \
              "$(date -Is)" "$RUNNER_NAME" "${TERMINAL_URL:-unknown}"
            sleep "${IDLE_SECONDS:-3}"
          done

      - name: Cleanup hosted terminal
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f "$RUNNER_TEMP/ttyd.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ttyd.pid")" 2>/dev/null || true
          fi

          if [ -f "$RUNNER_TEMP/cloudflared.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || true
          fi

          rm -f "$RUNNER_TEMP/terminal-token"
          echo "Hosted terminal cleaned up."
