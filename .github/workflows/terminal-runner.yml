name: GitHub Hosted Terminal Runner

on:
  workflow_dispatch:
    inputs:
      shell:
        description: "Shell to run inside the hosted runner"
        required: true
        default: "bash"
        type: choice
        options:
          - bash
          - sh
      idle_seconds:
        description: "Health-check interval"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-terminal
  cancel-in-progress: true

jobs:
  terminal:
    name: Hosted terminal (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          node --version
          npm --version

      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: $(uname -srm)"
          echo "Host: $(hostname)"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          echo "Shell: ${{ inputs.shell || 'bash' }}"

      - name: Install ttyd
        shell: bash
        run: |
          set -euo pipefail
          TTYD_VERSION="1.7.7"
          curl -fsSL "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64" -o "$RUNNER_TEMP/ttyd"
          chmod +x "$RUNNER_TEMP/ttyd"
          "$RUNNER_TEMP/ttyd" --version

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARED_VERSION="2026.9.1"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

      - name: Start hosted PTY and authenticated relay
        id: start-terminal
        shell: bash
        env:
          TERMINAL_SHELL: ${{ inputs.shell || 'bash' }}
        run: |
          set -euo pipefail

          TOKEN="$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/terminal-token"
          chmod 600 "$RUNNER_TEMP/terminal-token"
          echo "TERMINAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          if [ "$TERMINAL_SHELL" = "sh" ]; then
            SHELL_CMD="/bin/sh"
            SHELL_ARGS=()
          else
            SHELL_CMD="/bin/bash"
            SHELL_ARGS=("--login")
          fi

          nohup "$RUNNER_TEMP/ttyd" \
            -W \
            -p 7681 \
            -i 127.0.0.1 \
            -P 8 \
            "$SHELL_CMD" "${SHELL_ARGS[@]}" \
            > "$RUNNER_TEMP/ttyd.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ttyd.pid"

          nohup npm run relay \
            > "$RUNNER_TEMP/relay.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/relay.pid"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          if ! kill -0 "$(cat "$RUNNER_TEMP/ttyd.pid")" 2>/dev/null; then
            echo "ttyd failed to start"
            cat "$RUNNER_TEMP/ttyd.log"
            exit 1
          fi
          if ! kill -0 "$(cat "$RUNNER_TEMP/relay.pid")" 2>/dev/null; then
            echo "relay failed to start"
            cat "$RUNNER_TEMP/relay.log"
            exit 1
          fi

          echo "PTY: 127.0.0.1:7681"
          echo "Relay: 127.0.0.1:8090"
          echo "Authentication: 256-bit random relay token"

      - name: Start public WebSocket tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail

          nohup "$RUNNER_TEMP/cloudflared" tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8090 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"

          URL=""
          for _ in $(seq 1 45); do
            URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Cloudflare tunnel did not provide a public URL"
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          WS_URL="${URL/https:\/\//wss://}/ws"
          ENDPOINT_URL="https://icy-person.github.io/terminal/?endpoint=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$WS_URL")&token=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TERMINAL_TOKEN")"

          echo "TERMINAL_URL=$URL" >> "$GITHUB_ENV"
          echo "TERMINAL_WS_URL=$WS_URL" >> "$GITHUB_ENV"
          echo "TERMINAL_PAGES_URL=$ENDPOINT_URL" >> "$GITHUB_ENV"

          echo ""
          echo "============================================================"
          echo "HOSTED TERMINAL READY"
          echo "WebSocket endpoint: $WS_URL"
          echo "Pages connect URL:  $ENDPOINT_URL"
          echo "Token is embedded only in the generated connect URL."
          echo "The token is not printed separately."
          echo "============================================================"
          echo ""

      - name: Write connection summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## GitHub Hosted Terminal"
            echo
            echo "**Runner:** ${RUNNER_NAME}"
            echo "**Tunnel:** ${TERMINAL_URL}"
            echo
            echo "### Connect"
            echo "[Open terminal UI](${TERMINAL_PAGES_URL})"
            echo
            echo "The browser connects with xterm.js over WebSocket to the authenticated relay, which forwards the ttyd protocol to the local PTY."
            echo
            echo "The endpoint/token expire when this workflow job ends."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep runner alive and monitor services
        shell: bash
        env:
          IDLE_SECONDS: ${{ inputs.idle_seconds || '5' }}
        run: |
          set -euo pipefail
          echo "Hosted terminal is ready. Job remains alive until cancelled or timeout."

          while true; do
            TTYD_PID="$(cat "$RUNNER_TEMP/ttyd.pid")"
            RELAY_PID="$(cat "$RUNNER_TEMP/relay.pid")"
            TUNNEL_PID="$(cat "$RUNNER_TEMP/cloudflared.pid")"

            if ! kill -0 "$TTYD_PID" 2>/dev/null; then
              echo "ERROR: ttyd stopped"
              tail -n 50 "$RUNNER_TEMP/ttyd.log" || true
              exit 1
            fi
            if ! kill -0 "$RELAY_PID" 2>/dev/null; then
              echo "ERROR: relay stopped"
              tail -n 50 "$RUNNER_TEMP/relay.log" || true
              exit 1
            fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "ERROR: cloudflared stopped"
              tail -n 50 "$RUNNER_TEMP/cloudflared.log" || true
              exit 1
            fi
            if ! curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1; then
              echo "ERROR: relay health check failed"
              exit 1
            fi

            printf '[%s] runner=%s ttyd=alive relay=alive tunnel=alive url=%s\n' "$(date -Is)" "$RUNNER_NAME" "${TERMINAL_URL:-unknown}"
            sleep "${IDLE_SECONDS:-5}"
          done

      - name: Cleanup hosted terminal
        if: always()
        shell: bash
        run: |
          set +e
          for file in ttyd.pid relay.pid cloudflared.pid; do
            if [ -f "$RUNNER_TEMP/$file" ]; then
              kill "$(cat "$RUNNER_TEMP/$file")" 2>/dev/null || true
            fi
          done
          rm -f "$RUNNER_TEMP/terminal-token"
          echo "Hosted terminal cleaned up."
