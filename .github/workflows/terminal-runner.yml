name: GitHub Hosted Terminal Runner

on:
  workflow_dispatch:
    inputs:
      shell:
        description: "Shell to run inside the hosted runner"
        required: true
        default: "bash"
        type: choice
        options: [bash, sh]
      idle_seconds:
        description: "Health-check interval"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-terminal
  cancel-in-progress: true

jobs:
  terminal:
    name: Hosted terminal + noVNC desktop (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          node --version
          npm --version

      - name: Install ttyd, cloudflared and desktop stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            dbus-x11 \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            curl

          curl -fsSL "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" -o "$RUNNER_TEMP/ttyd"
          chmod +x "$RUNNER_TEMP/ttyd"
          "$RUNNER_TEMP/ttyd" --version

          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64" -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

          Xvfb -version
          x11vnc -version 2>&1 | head -n 1 || true
          websockify --version

      - name: Start virtual desktop
        run: |
          set -euo pipefail
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

          nohup Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xvfb.pid"

          for _ in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null

          nohup dbus-run-session -- startxfce4 > "$RUNNER_TEMP/xfce.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xfce.pid"

          nohup x11vnc \
            -display :99 \
            -forever \
            -shared \
            -localhost \
            -rfbport 5900 \
            -noxdamage \
            -nopw \
            > "$RUNNER_TEMP/x11vnc.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/x11vnc.pid"

          nohup websockify \
            --web=/usr/share/novnc/ \
            6080 \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/websockify.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/websockify.pid"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null
          kill -0 "$(cat "$RUNNER_TEMP/xvfb.pid")"
          kill -0 "$(cat "$RUNNER_TEMP/x11vnc.pid")"
          kill -0 "$(cat "$RUNNER_TEMP/websockify.pid")"

          echo "Desktop: Xvfb :99 / XFCE"
          echo "VNC: 127.0.0.1:5900"
          echo "noVNC: 127.0.0.1:6080"

      - name: Start hosted PTY and relay
        env:
          TERMINAL_SHELL: ${{ inputs.shell || 'bash' }}
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/terminal-token"
          chmod 600 "$RUNNER_TEMP/terminal-token"
          echo "TERMINAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          export TERMINAL_TOKEN="$TOKEN"

          if [ "$TERMINAL_SHELL" = "sh" ]; then SHELL_CMD=/bin/sh; SHELL_ARGS=(); else SHELL_CMD=/bin/bash; SHELL_ARGS=(--login); fi

          nohup "$RUNNER_TEMP/ttyd" -W -p 7681 -i 127.0.0.1 -P 8 "$SHELL_CMD" "${SHELL_ARGS[@]}" > "$RUNNER_TEMP/ttyd.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ttyd.pid"

          export NOVNC_HTTP_URL="http://127.0.0.1:6080"
          export NOVNC_WS_URL="ws://127.0.0.1:6080/websockify"
          nohup npm run relay > "$RUNNER_TEMP/relay.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/relay.pid"

          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/healthz >/dev/null
          curl -fsS http://127.0.0.1:8090/novnc/vnc.html >/dev/null
          kill -0 "$(cat "$RUNNER_TEMP/ttyd.pid")"
          kill -0 "$(cat "$RUNNER_TEMP/relay.pid")"
          echo "PTY: 127.0.0.1:7681"
          echo "Relay: 127.0.0.1:8090"

      - name: Start public Quick Tunnel
        run: |
          set -euo pipefail
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8090 > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"

          URL=""
          for _ in $(seq 1 60); do
            URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { cat "$RUNNER_TEMP/cloudflared.log"; exit 1; }

          HOSTNAME="${URL#https://}"
          for _ in $(seq 1 150); do getent ahostsv4 "$HOSTNAME" >/dev/null 2>&1 && break; sleep 2; done
          getent ahostsv4 "$HOSTNAME" >/dev/null 2>&1 || { tail -n 100 "$RUNNER_TEMP/cloudflared.log"; exit 1; }

          TOKEN_QS="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$TERMINAL_TOKEN")"
          WS_URL="${URL/https:\/\//wss://}/ws"
          ENDPOINT_URL="https://icy-person.github.io/terminal/?endpoint=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$WS_URL")&token=$TOKEN_QS"
          NOVNC_PATH="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "websockify?token=$TERMINAL_TOKEN")"
          NOVNC_URL="$URL/novnc/vnc.html?path=$NOVNC_PATH"

          echo "TERMINAL_URL=$URL" >> "$GITHUB_ENV"
          echo "TERMINAL_WS_URL=$WS_URL" >> "$GITHUB_ENV"
          echo "TERMINAL_PAGES_URL=$ENDPOINT_URL" >> "$GITHUB_ENV"
          echo "NOVNC_URL=$NOVNC_URL" >> "$GITHUB_ENV"
          echo "HOSTED TERMINAL: $ENDPOINT_URL"
          echo "HOSTED DESKTOP: $NOVNC_URL"

      - name: End-to-end terminal and desktop diagnostic
        run: |
          set +e
          STATUS=0

          echo "[1/6] Direct runner -> ttyd"
          node <<'NODE'
          import WebSocket from "ws";
          const ws = new WebSocket("ws://127.0.0.1:7681/ws", "tty", { origin: "http://127.0.0.1:7681", perMessageDeflate: false, handshakeTimeout: 8000 });
          let sentInput = false, gotData = false;
          const timer = setTimeout(() => { console.error("[LOCAL_FAIL] ttyd input/output timeout"); ws.terminate(); process.exitCode = 1; }, 15000);
          ws.on("open", () => { console.log(`[LOCAL_OPEN] subprotocol=${ws.protocol}`); ws.send(JSON.stringify({ columns: 100, rows: 30 })); });
          ws.on("message", data => {
            const b = Buffer.from(data);
            console.log(`[LOCAL_MESSAGE] bytes=${b.length} prefix=0x${b[0]?.toString(16).padStart(2,"0")}`);
            if (!sentInput && b[0] === 0x32) { sentInput = true; setTimeout(() => ws.send(Buffer.from([0x30, ...Buffer.from("echo __TTYD_LOCAL_OK__\\n")])), 1000); }
            if (b[0] === 0x30) gotData = true;
            if (gotData) { clearTimeout(timer); console.log("[LOCAL_TTYD_OK]"); ws.close(1000); process.exitCode = 0; }
          });
          ws.once("unexpected-response", (_r,res) => { clearTimeout(timer); console.error(`[LOCAL_HTTP_FAIL] ${res.statusCode}`); res.resume(); process.exitCode=1; });
          ws.once("error", e => { clearTimeout(timer); console.error(`[LOCAL_WS_FAIL] ${e.message}`); process.exitCode=1; });
          NODE
          [ $? -eq 0 ] || STATUS=1

          echo "[2/6] Local noVNC HTTP"
          curl -fsSI http://127.0.0.1:8090/novnc/vnc.html || STATUS=1

          echo "[3/6] Local noVNC WebSocket -> VNC"
          node <<'NODE'
          import WebSocket from "ws";
          const token = process.env.TERMINAL_TOKEN;
          const u = new URL("ws://127.0.0.1:8090/novnc/websockify");
          u.searchParams.set("token", token);
          const ws = new WebSocket(u, { perMessageDeflate: false, handshakeTimeout: 10000 });
          const timer = setTimeout(() => { console.error("[NOVNC_LOCAL_FAIL] websocket timeout"); ws.terminate(); process.exitCode=1; }, 12000);
          ws.on("open", () => console.log("[NOVNC_LOCAL_OPEN] websocket connected"));
          ws.on("message", data => { clearTimeout(timer); console.log(`[NOVNC_LOCAL_OK] first VNC message bytes=${Buffer.byteLength(data)}`); ws.close(1000); process.exitCode=0; });
          ws.once("unexpected-response", (_r,res) => { clearTimeout(timer); console.error(`[NOVNC_LOCAL_HTTP_FAIL] ${res.statusCode}`); res.resume(); process.exitCode=1; });
          ws.once("error", e => { clearTimeout(timer); console.error(`[NOVNC_LOCAL_WS_FAIL] ${e.message}`); process.exitCode=1; });
          NODE
          [ $? -eq 0 ] || STATUS=1

          echo "[4/6] Public HTTP health"
          curl -fsS "${TERMINAL_URL}/healthz" | python3 -m json.tool || STATUS=1

          echo "[5/6] Public Cloudflare -> relay -> ttyd"
          node <<'NODE'
          import WebSocket from "ws";
          const u = new URL(process.env.TERMINAL_WS_URL);
          u.searchParams.set("token", process.env.TERMINAL_TOKEN);
          const ws = new WebSocket(u, "tty", { perMessageDeflate: false, handshakeTimeout: 10000 });
          let sentInput = false, gotPty = false;
          const timer = setTimeout(() => { console.error("[PUBLIC_FAIL] ttyd input/output timeout"); ws.terminate(); process.exitCode = 1; }, 18000);
          ws.on("open", () => { console.log(`[PUBLIC_OPEN] subprotocol=${ws.protocol}`); ws.send(JSON.stringify({ columns: 100, rows: 30 })); });
          ws.on("message", data => {
            const b = Buffer.from(data);
            console.log(`[PUBLIC_MESSAGE] bytes=${b.length} prefix=0x${b[0]?.toString(16).padStart(2,"0")}`);
            if (!sentInput && b[0] === 0x32) { sentInput = true; setTimeout(() => ws.send(Buffer.from([0x30, ...Buffer.from("echo __TTYD_PUBLIC_OK__\\n")])), 1000); }
            if (b[0] === 0x30) gotPty = true;
            if (gotPty) { clearTimeout(timer); console.log("[PUBLIC_TTYD_OK]"); ws.close(1000); process.exitCode=0; }
          });
          ws.once("unexpected-response", (_r,res) => { clearTimeout(timer); console.error(`[PUBLIC_HTTP_FAIL] ${res.statusCode}`); res.resume(); process.exitCode=1; });
          ws.once("error", e => { clearTimeout(timer); console.error(`[PUBLIC_WS_FAIL] ${e.message}`); process.exitCode=1; });
          NODE
          [ $? -eq 0 ] || STATUS=1

          echo "[6/6] Public Cloudflare -> relay -> noVNC -> VNC"
          node <<'NODE'
          import WebSocket from "ws";
          const u = new URL(`${process.env.TERMINAL_URL}/novnc/websockify`);
          u.searchParams.set("token", process.env.TERMINAL_TOKEN);
          const ws = new WebSocket(u, { perMessageDeflate: false, handshakeTimeout: 10000 });
          const timer = setTimeout(() => { console.error("[NOVNC_PUBLIC_FAIL] websocket timeout"); ws.terminate(); process.exitCode=1; }, 15000);
          ws.on("open", () => console.log("[NOVNC_PUBLIC_OPEN] websocket connected"));
          ws.on("message", data => { clearTimeout(timer); console.log(`[NOVNC_PUBLIC_OK] first VNC message bytes=${Buffer.byteLength(data)}`); ws.close(1000); process.exitCode=0; });
          ws.once("unexpected-response", (_r,res) => { clearTimeout(timer); console.error(`[NOVNC_PUBLIC_HTTP_FAIL] ${res.statusCode}`); res.resume(); process.exitCode=1; });
          ws.once("error", e => { clearTimeout(timer); console.error(`[NOVNC_PUBLIC_WS_FAIL] ${e.message}`); process.exitCode=1; });
          NODE
          [ $? -eq 0 ] || STATUS=1

          echo "--- service logs ---"
          echo "--- xvfb ---"; tail -n 60 "$RUNNER_TEMP/xvfb.log" || true
          echo "--- xfce ---"; tail -n 100 "$RUNNER_TEMP/xfce.log" || true
          echo "--- x11vnc ---"; tail -n 80 "$RUNNER_TEMP/x11vnc.log" || true
          echo "--- websockify ---"; tail -n 80 "$RUNNER_TEMP/websockify.log" || true
          echo "--- ttyd ---"; tail -n 100 "$RUNNER_TEMP/ttyd.log" || true
          echo "--- relay ---"; tail -n 180 "$RUNNER_TEMP/relay.log" || true
          echo "--- cloudflared ---"; tail -n 80 "$RUNNER_TEMP/cloudflared.log" || true
          exit "$STATUS"

      - name: Keep terminal and desktop alive
        run: |
          set -euo pipefail
          echo "Terminal and desktop remain available until the workflow is cancelled or times out."
          while true; do sleep "${{ inputs.idle_seconds || '5' }}"; done
