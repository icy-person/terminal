name: GitHub Hosted Terminal Runner (Arch + RDP)

on:
  workflow_dispatch:
    inputs:
      shell:
        description: "Shell to run inside the hosted runner"
        required: true
        default: "bash"
        type: choice
        options: [bash, sh]
      idle_seconds:
        description: "Health-check interval"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-terminal-fixed
  cancel-in-progress: true

jobs:
  terminal:
    name: Hosted terminal + RDP desktop (Arch)
    runs-on: ubuntu-26.04
    timeout-minutes: 350

    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm nodejs npm python python-pip git base-devel sudo curl ca-certificates tar gnupg
          npm install --no-audit --no-fund --ignore-scripts

      - name: Build and install Arch RDP packages
        shell: bash
        run: |
          set -euo pipefail

          # xrdp and xorgxrdp are AUR packages on current Arch Linux.
          # Preselect a JACK provider so makepkg/pacman never asks an interactive
          # provider question inside GitHub Actions.
          pacman -S --needed --noconfirm pipewire-jack

          useradd -m -s /bin/bash aurbuilder
          printf 'aurbuilder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/aurbuilder
          chmod 440 /etc/sudoers.d/aurbuilder

          rm -rf "$RUNNER_TEMP/aur-xrdp" "$RUNNER_TEMP/aur-xorgxrdp"
          git clone --depth=1 https://aur.archlinux.org/xrdp.git "$RUNNER_TEMP/aur-xrdp"
          git clone --depth=1 https://aur.archlinux.org/xorgxrdp.git "$RUNNER_TEMP/aur-xorgxrdp"
          chown -R aurbuilder:aurbuilder "$RUNNER_TEMP/aur-xrdp" "$RUNNER_TEMP/aur-xorgxrdp"

          # xrdp 0.10.6.1-1 has environment-sensitive bitmap-scaling tests.
          # Skip only the package check phase; integration tests below remain enabled.
          su - aurbuilder -c "cd '$RUNNER_TEMP/aur-xrdp' && makepkg -si --noconfirm --needed --nocheck"

          # Import the xorgxrdp maintainer key used by the AUR PKGBUILD, then
          # keep normal detached-signature verification enabled.
          su - aurbuilder -c "gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys 61ECEABBF2BB40E3A35DF30A9F72CDBC01BF10EB"
          su - aurbuilder -c "cd '$RUNNER_TEMP/aur-xorgxrdp' && makepkg -si --noconfirm --needed --nocheck"

          pacman -S --needed --noconfirm \
            xfce4 \
            xfce4-terminal \
            dbus \
            xorg \
            xorg-xinit \
            curl \
            tar

          XRDP_USER="rdpuser"
          XRDP_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          useradd -m -s /bin/bash "$XRDP_USER"
          printf '%s:%s\n' "$XRDP_USER" "$XRDP_PASSWORD" | chpasswd

          install -d -m 700 -o "$XRDP_USER" -g "$XRDP_USER" "/home/$XRDP_USER"
          printf '%s\n' '#!/bin/sh' 'exec startxfce4' > "/home/$XRDP_USER/.xinitrc"
          chmod 700 "/home/$XRDP_USER/.xinitrc"
          chown "$XRDP_USER:$XRDP_USER" "/home/$XRDP_USER/.xinitrc"

          install -d /etc/X11
          printf '%s\n' 'allowed_users=anybody' 'needs_root_rights=no' > /etc/X11/Xwrapper.config

          # xorgxrdp launches a dedicated Xorg session for each RDP login.
          # Do not use the old Xvfb/x11vnc/noVNC stack anymore.
          if grep -qE '^\s*param=Xorg\s*$' /etc/xrdp/sesman.ini; then
            sed -i 's/^\s*param=Xorg\s*$/param=\/usr\/lib\/Xorg/' /etc/xrdp/sesman.ini
          fi

          # Keep RDP private to the container. Public access is provided by
          # the WebSocket tunnel below, not by exposing raw TCP/3389.
          sed -i -E 's/^\s*port=.*/port=tcp:\/\/127.0.0.1:3389/' /etc/xrdp/xrdp.ini

          mkdir -p /run/xrdp /var/log/xrdp
          chmod 755 /run/xrdp

          curl -fsSL "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" -o "$RUNNER_TEMP/ttyd"
          chmod +x "$RUNNER_TEMP/ttyd"
          "$RUNNER_TEMP/ttyd" --version

          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64" -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

          WSTUNNEL_VERSION="10.7.1"
          WSTUNNEL_ARCHIVE="wstunnel_${WSTUNNEL_VERSION}_linux_amd64.tar.gz"
          WSTUNNEL_URL="https://github.com/erebe/wstunnel/releases/download/v${WSTUNNEL_VERSION}/${WSTUNNEL_ARCHIVE}"
          WSTUNNEL_CHECKSUMS_URL="https://github.com/erebe/wstunnel/releases/download/v${WSTUNNEL_VERSION}/checksums.txt"

          curl -fsSL "$WSTUNNEL_URL" -o "$RUNNER_TEMP/$WSTUNNEL_ARCHIVE"
          curl -fsSL "$WSTUNNEL_CHECKSUMS_URL" -o "$RUNNER_TEMP/wstunnel-checksums.txt"
          (cd "$RUNNER_TEMP" && grep -F "$WSTUNNEL_ARCHIVE" wstunnel-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$WSTUNNEL_ARCHIVE" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/wstunnel"
          "$RUNNER_TEMP/wstunnel" --version

          echo "RDP_USER=$XRDP_USER" >> "$GITHUB_ENV"
          echo "RDP_PASSWORD=$XRDP_PASSWORD" >> "$GITHUB_ENV"
          echo "WSTUNNEL_VERSION=$WSTUNNEL_VERSION" >> "$GITHUB_ENV"

          xrdp --version
          XORG_VERSION="$(Xorg -version 2>&1)"
          printf '%s\n' "$XORG_VERSION"

      - name: Show Arch environment
        shell: bash
        run: |
          set -euo pipefail
          echo "=== OS ==="
          cat /etc/os-release
          echo
          echo "=== Kernel ==="
          uname -a
          echo
          echo "=== glibc ==="
          ldd --version 2>&1
          echo
          echo "=== CPU ==="
          nproc
          awk '/^model name/ {print; exit}' /proc/cpuinfo

      - name: Start xrdp desktop
        shell: bash
        run: |
          set -euo pipefail

          nohup xrdp-sesman --nodaemon >"$RUNNER_TEMP/xrdp-sesman.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xrdp-sesman.pid"

          for _ in $(seq 1 30); do
            [ -S /run/xrdp/sesman.socket ] && break
            sleep 1
          done
          [ -S /run/xrdp/sesman.socket ] || { cat "$RUNNER_TEMP/xrdp-sesman.log"; exit 1; }

          nohup xrdp --nodaemon >"$RUNNER_TEMP/xrdp.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xrdp.pid"

          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/3389) >/dev/null 2>&1 && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/3389)
          kill -0 "$(cat "$RUNNER_TEMP/xrdp-sesman.pid")"
          kill -0 "$(cat "$RUNNER_TEMP/xrdp.pid")"

          echo "RDP is listening privately on 127.0.0.1:3389"
          echo "RDP user: $RDP_USER"

      - name: Start hosted PTY and RDP WebSocket tunnel
        env:
          TERMINAL_SHELL: ${{ inputs.shell || 'bash' }}
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "TERMINAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          export TERMINAL_TOKEN="$TOKEN"

          if [ "$TERMINAL_SHELL" = "sh" ]; then
            SHELL_CMD=/bin/sh
            SHELL_ARGS=()
          else
            SHELL_CMD=/bin/bash
            SHELL_ARGS=(--login)
          fi

          nohup "$RUNNER_TEMP/ttyd" -W -p 7681 -i 127.0.0.1 -P 8 "$SHELL_CMD" "${SHELL_ARGS[@]}" >"$RUNNER_TEMP/ttyd.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ttyd.pid"

          # No RDP authentication token: relay routes all non-/ws WebSocket
          # upgrades to this private wstunnel endpoint. wstunnel itself is
          # restricted to the xrdp socket and uses its default path prefix.
          nohup "$RUNNER_TEMP/wstunnel" server \
            --restrict-to 127.0.0.1:3389 \
            ws://127.0.0.1:8091 \
            >"$RUNNER_TEMP/wstunnel.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wstunnel.pid"

          export RDP_WS_URL="ws://127.0.0.1:8091"
          nohup npm run relay >"$RUNNER_TEMP/relay.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/relay.pid"

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/healthz >/dev/null
          kill -0 "$(cat "$RUNNER_TEMP/ttyd.pid")"
          kill -0 "$(cat "$RUNNER_TEMP/wstunnel.pid")"
          kill -0 "$(cat "$RUNNER_TEMP/relay.pid")"

          # Verify the tokenless local RDP WebSocket path. wstunnel defaults
          # to the same /v1 prefix on both client and server.
          nohup "$RUNNER_TEMP/wstunnel" client \
            -L "tcp://13389:127.0.0.1:3389" \
            ws://127.0.0.1:8090 \
            >"$RUNNER_TEMP/wstunnel-client-test.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wstunnel-client-test.pid"

          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/13389) >/dev/null 2>&1 && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/13389)
          kill "$(cat "$RUNNER_TEMP/wstunnel-client-test.pid")" || true
          echo "Local tokenless RDP-over-WebSocket tunnel test passed."

      - name: Start public Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8090 >"$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"

          URL=""
          for _ in $(seq 1 60); do
            URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { cat "$RUNNER_TEMP/cloudflared.log"; exit 1; }

          TOKEN_QS="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TERMINAL_TOKEN")"
          WS_URL="${URL/https:\/\//wss://}/ws"
          ENDPOINT_URL="https://icy-person.github.io/terminal/?endpoint=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$WS_URL")&token=$TOKEN_QS"

          RDP_WS_URL="${URL/https:\/\//wss://}"
          RDP_LOCAL_PORT="33890"
          RDP_CLIENT_CMD="$RUNNER_TEMP/wstunnel client -L tcp://$RDP_LOCAL_PORT:127.0.0.1:3389 $RDP_WS_URL"

          echo "TERMINAL_URL=$URL" >> "$GITHUB_ENV"
          echo "TERMINAL_WS_URL=$WS_URL" >> "$GITHUB_ENV"
          echo "TERMINAL_PAGES_URL=$ENDPOINT_URL" >> "$GITHUB_ENV"
          echo "RDP_WS_URL_PUBLIC=$RDP_WS_URL" >> "$GITHUB_ENV"
          echo "RDP_LOCAL_PORT=$RDP_LOCAL_PORT" >> "$GITHUB_ENV"

          echo "HOSTED TERMINAL: $ENDPOINT_URL"
          echo "RDP WebSocket endpoint: $RDP_WS_URL"
          echo "RDP user: $RDP_USER"
          echo "RDP password: $RDP_PASSWORD"
          echo "RDP local forward command: $RDP_CLIENT_CMD"
          echo "Then connect your RDP client to: 127.0.0.1:$RDP_LOCAL_PORT"

      - name: End-to-end diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "[1/3] local relay health"
          curl -fsS http://127.0.0.1:8090/healthz | python3 -m json.tool

          echo "[2/3] local RDP socket"
          (exec 3<>/dev/tcp/127.0.0.1/3389)
          echo "xrdp is reachable on 127.0.0.1:3389"

          echo "[3/3] public health"
          PUBLIC_OK=0
          PUBLIC_HOST="${TERMINAL_URL#https://}"
          for _ in $(seq 1 30); do
            if getent ahostsv4 "$PUBLIC_HOST" >/dev/null 2>&1 && curl -4 --connect-timeout 5 --max-time 15 -fsS "$TERMINAL_URL/healthz" | python3 -m json.tool; then
              PUBLIC_OK=1
              break
            fi
            echo "Public endpoint not ready yet; retrying DNS/tunnel..."
            sleep 2
          done
          [ "$PUBLIC_OK" -eq 1 ]
          echo "Diagnostics passed."

      - name: Keep terminal and RDP alive
        shell: bash
        run: |
          set -euo pipefail
          echo "Terminal: $TERMINAL_PAGES_URL"
          echo "RDP WebSocket: $RDP_WS_URL_PUBLIC"
          echo "RDP user: $RDP_USER"
          echo "RDP password: $RDP_PASSWORD"
          echo "Run the printed wstunnel client command locally, then connect your RDP client to 127.0.0.1:$RDP_LOCAL_PORT."
          echo "Runner services remain available until cancellation/timeout."
          while true; do
            sleep "${{ inputs.idle_seconds || '5' }}"
          done
