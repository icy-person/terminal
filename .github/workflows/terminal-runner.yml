name: GitHub Hosted Terminal Runner (Arch + RDP)

on:
  workflow_dispatch:
    inputs:
      shell:
        description: Shell to run inside the hosted runner
        required: true
        default: bash
        type: choice
        options:
          - bash
          - sh
      idle_seconds:
        description: Health-check interval
        required: true
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-terminal-fixed
  cancel-in-progress: true

jobs:
  terminal:
    name: Hosted terminal + RDP desktop (Arch)
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm nodejs npm python python-pip git base-devel sudo curl ca-certificates tar gnupg
          npm install --no-audit --no-fund --ignore-scripts

      - name: Build and install Arch RDP packages
        shell: bash
        env:
          XRDP_FIXED_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$XRDP_FIXED_PASSWORD" ] || { echo 'Missing required repository secret: RDP_PASSWORD'; exit 1; }
          echo "::add-mask::$XRDP_FIXED_PASSWORD"

          useradd -m -s /bin/bash aurbuilder
          printf '%s\n' 'aurbuilder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/aurbuilder
          chmod 440 /etc/sudoers.d/aurbuilder

          rm -rf "$RUNNER_TEMP/aur-xrdp" "$RUNNER_TEMP/aur-xorgxrdp"
          git clone --depth=1 https://aur.archlinux.org/xrdp.git "$RUNNER_TEMP/aur-xrdp"
          git clone --depth=1 https://aur.archlinux.org/xorgxrdp.git "$RUNNER_TEMP/aur-xorgxrdp"
          chown -R aurbuilder:aurbuilder "$RUNNER_TEMP/aur-xrdp" "$RUNNER_TEMP/aur-xorgxrdp"
          su - aurbuilder -c "cd '$RUNNER_TEMP/aur-xrdp' && makepkg -si --noconfirm --needed --nocheck"
          su - aurbuilder -c "gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys 61ECEABBF2BB40E3A35DF30A9F72CDBC01BF10EB"
          su - aurbuilder -c "cd '$RUNNER_TEMP/aur-xorgxrdp' && makepkg -si --noconfirm --needed --nocheck"

          pacman -S --needed --noconfirm xfce4 xfce4-terminal dbus xorg xorg-xinit curl tar

          XRDP_USER=rdpuser
          useradd -m -s /bin/bash "$XRDP_USER"
          printf '%s:%s\n' "$XRDP_USER" "$XRDP_FIXED_PASSWORD" | chpasswd

          cat > /etc/xrdp/startwm.sh <<'EOF'
          #!/bin/sh
          if [ -r /etc/profile ]; then . /etc/profile; fi
          if [ -r "$HOME/.profile" ]; then . "$HOME/.profile"; fi
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS="/etc/xdg/xdg-xfce:/etc/xdg"
          export XDG_DATA_DIRS="/usr/local/share:/usr/share"
          exec dbus-run-session -- startxfce4
          EOF
          chmod 755 /etc/xrdp/startwm.sh

          install -d /etc/X11 /run/xrdp /var/log/xrdp
          printf '%s\n' 'allowed_users=anybody' 'needs_root_rights=no' > /etc/X11/Xwrapper.config
          sed -i -E 's/^\s*param=Xorg\s*$/param=\/usr\/lib\/Xorg/' /etc/xrdp/sesman.ini
          sed -i -E 's/^\s*port=.*/port=tcp:\/\/127.0.0.1:3389/' /etc/xrdp/xrdp.ini
          sed -i -E 's/^\s*KillDisconnected=.*/KillDisconnected=false/' /etc/xrdp/sesman.ini
          sed -i -E 's/^\s*Policy=.*/Policy=Default/' /etc/xrdp/sesman.ini

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep only the native Xorg connection section in xrdp.ini.
          # Everything after [Xorg] is a selectable/proxy connection type;
          # removing it prevents xrdp from ever offering Xvnc/libvnc.
          p = Path('/etc/xrdp/xrdp.ini')
          s = p.read_text()
          m = re.search(r'^\[Xorg\]\n', s, re.M)
          if not m:
              raise SystemExit('xrdp.ini has no [Xorg] section')
          tail = s[m.start():]
          n = re.search(r'^\[[^\n]+\]\n', tail[len('[Xorg]\n'):], re.M)
          if n:
              tail = tail[:len('[Xorg]\n') + n.start()]

          # xrdp's Xorg connection must explicitly provide an IP. Without it,
          # libxup.so reaches the connection stage with an empty target and
          # xrdp reports: "error - no ip set".
          lines = tail.rstrip().splitlines()
          if not lines or lines[0] != '[Xorg]':
              raise SystemExit('invalid [Xorg] section')
          lines = [line for line in lines if not re.match(r'^(ip|port|code)=', line)]
          insert_at = len(lines)
          lines[insert_at:insert_at] = [
              'ip=127.0.0.1',
              'port=-1',
              'code=20',
          ]
          p.write_text(s[:m.start()] + '\n'.join(lines).rstrip() + '\n')

          # Remove the Xvnc display-server definition from sesman.ini while
          # preserving [Chansrv] and the remaining session configuration.
          p = Path('/etc/xrdp/sesman.ini')
          s = p.read_text()
          s = re.sub(r'^\[Xvnc\]\n.*?(?=^\[[^\n]+\]\n|\Z)', '', s, flags=re.M | re.S)
          p.write_text(s)
          PY

          echo '=== Active xrdp connection sections ==='
          grep -nE '^\[[^]]+\]$' /etc/xrdp/xrdp.ini
          if grep -q '^\[Xvnc\]$' /etc/xrdp/xrdp.ini; then
            echo 'Xvnc connection section is still enabled.'
            exit 1
          fi
          if grep -q '^lib=libvnc\.so$' /etc/xrdp/xrdp.ini; then
            echo 'libvnc.so is still active in xrdp.ini.'
            exit 1
          fi
          grep -A8 '^\[Xorg\]$' /etc/xrdp/xrdp.ini
          grep -q '^code=20$' /etc/xrdp/xrdp.ini || { echo 'Xorg code=20 is missing'; exit 1; }
          grep -q '^lib=libxup\.so$' /etc/xrdp/xrdp.ini || { echo 'Xorg libxup.so is missing'; exit 1; }
          grep -q '^ip=127\.0\.0\.1$' /etc/xrdp/xrdp.ini || { echo 'Xorg ip=127.0.0.1 is missing'; exit 1; }
          grep -q '^port=-1$' /etc/xrdp/xrdp.ini || { echo 'Xorg port=-1 is missing'; exit 1; }
          grep -q '^\[Xvnc\]$' /etc/xrdp/sesman.ini && { echo 'Xvnc sesman backend is still enabled.'; exit 1; } || true

          curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o "$RUNNER_TEMP/ttyd"
          chmod +x "$RUNNER_TEMP/ttyd"
          "$RUNNER_TEMP/ttyd" --version

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

          WSTUNNEL_VERSION=10.7.1
          WSTUNNEL_ARCHIVE="wstunnel_${WSTUNNEL_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/erebe/wstunnel/releases/download/v${WSTUNNEL_VERSION}/${WSTUNNEL_ARCHIVE}" -o "$RUNNER_TEMP/$WSTUNNEL_ARCHIVE"
          curl -fsSL "https://github.com/erebe/wstunnel/releases/download/v${WSTUNNEL_VERSION}/checksums.txt" -o "$RUNNER_TEMP/wstunnel-checksums.txt"
          (cd "$RUNNER_TEMP" && grep -F "$WSTUNNEL_ARCHIVE" wstunnel-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$WSTUNNEL_ARCHIVE" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/wstunnel"
          "$RUNNER_TEMP/wstunnel" --version

          echo "RDP_USER=$XRDP_USER" >> "$GITHUB_ENV"
          echo "RDP_PASSWORD=$XRDP_FIXED_PASSWORD" >> "$GITHUB_ENV"

      - name: Start xrdp desktop
        shell: bash
        run: |
          set -euo pipefail
          nohup xrdp-sesman --nodaemon > "$RUNNER_TEMP/xrdp-sesman.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xrdp-sesman.pid"
          for _ in $(seq 1 30); do
            [ -S /run/xrdp/sesman.socket ] && break
            sleep 1
          done
          [ -S /run/xrdp/sesman.socket ] || { cat "$RUNNER_TEMP/xrdp-sesman.log"; exit 1; }

          nohup xrdp --nodaemon > "$RUNNER_TEMP/xrdp.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xrdp.pid"
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/3389) >/dev/null 2>&1 && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/3389)

          BOOTSTRAP_LOG="$RUNNER_TEMP/xrdp-bootstrap.log"
          exec 9<<<"$RDP_PASSWORD"
          xrdp-sesrun -t Xorg -g 1920x1080 -F 9 "$RDP_USER" > "$BOOTSTRAP_LOG" 2>&1 || {
            echo 'xrdp-sesrun failed to create the XFCE session.'
            cat "$BOOTSTRAP_LOG" || true
            cat "$RUNNER_TEMP/xrdp-sesman.log" || true
            exit 1
          }
          exec 9<&-

          GUI_READY=0
          for _ in $(seq 1 90); do
            if pgrep -f '/usr/lib/Xorg :[0-9]+' >/dev/null 2>&1 && \
               pgrep -u "$RDP_USER" -x xfce4-session >/dev/null 2>&1 && \
               pgrep -u "$RDP_USER" -x xfwm4 >/dev/null 2>&1; then
              GUI_READY=1
              break
            fi
            sleep 1
          done

          [ "$GUI_READY" -eq 1 ] || {
            echo 'XFCE did not become ready through xrdp-sesrun.'
            cat "$BOOTSTRAP_LOG" || true
            cat "$RUNNER_TEMP/xrdp-sesman.log" || true
            exit 1
          }

          echo '=== GUI processes ==='
          ps -eo user,pid,ppid,cmd | grep -E '[X]org|xfce4-session|xfdesktop|xfwm4|xfconfd' || true
          echo '=== xrdp session log ==='
          tail -n 120 "$RUNNER_TEMP/xrdp-sesman.log" || true
          echo 'XFCE desktop is UP before RDP tunnel startup.'

      - name: Start hosted PTY and RDP WebSocket tunnel
        env:
          TERMINAL_SHELL: ${{ inputs.shell || 'bash' }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "TERMINAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          export TERMINAL_TOKEN="$TOKEN"

          if [ "$TERMINAL_SHELL" = sh ]; then
            SHELL_CMD=/bin/sh
            SHELL_ARGS=()
          else
            SHELL_CMD=/bin/bash
            SHELL_ARGS=(--login)
          fi

          nohup "$RUNNER_TEMP/ttyd" -W -p 7681 -i 127.0.0.1 -P 8 "$SHELL_CMD" "${SHELL_ARGS[@]}" > "$RUNNER_TEMP/ttyd.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ttyd.pid"

          nohup "$RUNNER_TEMP/wstunnel" server --websocket-mask-frame --restrict-to 127.0.0.1:3389 ws://127.0.0.1:8091 > "$RUNNER_TEMP/wstunnel.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wstunnel.pid"

          export RDP_WS_URL=ws://127.0.0.1:8091
          nohup npm run relay > "$RUNNER_TEMP/relay.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/relay.pid"

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/healthz >/dev/null

          nohup "$RUNNER_TEMP/wstunnel" client --websocket-mask-frame -L tcp://13389:127.0.0.1:3389 ws://127.0.0.1:8090 > "$RUNNER_TEMP/wstunnel-client-test.log" 2>&1 &
          TEST_PID=$!
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/13389) >/dev/null 2>&1 && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/13389)
          kill "$TEST_PID" || true
          echo 'Local tokenless RDP-over-WebSocket tunnel test passed.'

      - name: Start public Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8090 > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"
          URL=''
          for _ in $(seq 1 60); do
            URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { cat "$RUNNER_TEMP/cloudflared.log"; exit 1; }

          TOKEN_QS="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TERMINAL_TOKEN")"
          WS_URL="${URL/https:\/\//wss://}/ws"
          ENDPOINT_URL="https://icy-person.github.io/terminal/?endpoint=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$WS_URL")&token=$TOKEN_QS"
          RDP_WS_URL_PUBLIC="${URL/https:\/\//wss://}"
          RDP_LOCAL_PORT=33890
          RDP_CLIENT_CMD="$RUNNER_TEMP/wstunnel client --websocket-mask-frame -L tcp://$RDP_LOCAL_PORT:127.0.0.1:3389 $RDP_WS_URL_PUBLIC"

          echo "TERMINAL_URL=$URL" >> "$GITHUB_ENV"
          echo "TERMINAL_WS_URL=$WS_URL" >> "$GITHUB_ENV"
          echo "TERMINAL_PAGES_URL=$ENDPOINT_URL" >> "$GITHUB_ENV"
          echo "RDP_WS_URL_PUBLIC=$RDP_WS_URL_PUBLIC" >> "$GITHUB_ENV"
          echo "RDP_LOCAL_PORT=$RDP_LOCAL_PORT" >> "$GITHUB_ENV"

          echo "HOSTED TERMINAL: $ENDPOINT_URL"
          echo "RDP WebSocket endpoint: $RDP_WS_URL_PUBLIC"
          echo "RDP user: $RDP_USER"
          echo 'RDP password: fixed repository secret (RDP_PASSWORD)'
          echo "RDP local forward command: $RDP_CLIENT_CMD"

      - name: End-to-end diagnostics
        shell: bash
        run: |
          set -euo pipefail
          pgrep -f '/usr/lib/Xorg :[0-9]+' >/dev/null
          pgrep -u "$RDP_USER" -x xfce4-session >/dev/null
          pgrep -u "$RDP_USER" -x xfwm4 >/dev/null
          curl -fsS http://127.0.0.1:8090/healthz | python3 -m json.tool
          (exec 3<>/dev/tcp/127.0.0.1/3389)
          echo 'Diagnostics passed.'

      - name: Keep terminal and RDP alive
        shell: bash
        run: |
          set -euo pipefail
          echo "Terminal: $TERMINAL_PAGES_URL"
          echo "RDP WebSocket: $RDP_WS_URL_PUBLIC"
          echo "RDP user: $RDP_USER"
          echo 'RDP password: fixed repository secret (RDP_PASSWORD)'
          echo "Run the printed wstunnel client command locally, then connect your RDP client to 127.0.0.1:$RDP_LOCAL_PORT."
          while true; do
            sleep "${{ inputs.idle_seconds || '5' }}"
          done
